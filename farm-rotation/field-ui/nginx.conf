server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API 反代到后端容器（compose 服务名 server）
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
